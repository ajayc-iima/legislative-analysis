[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "legislative-pdfs"
version = "0.1.0"
description = "Download/backfill NeVA reply PDFs, one folder per assembly/session"
requires-python = ">=3.10"
dependencies = ["requests"]

[tool.setuptools.packages.find]
where = ["src"]
