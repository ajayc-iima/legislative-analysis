[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "legislative-extract"
version = "0.1.0"
description = "Trial and extraction harness for NeVA reply PDFs (NVIDIA NIM)"
requires-python = ">=3.10"
dependencies = ["requests", "pymupdf", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]
