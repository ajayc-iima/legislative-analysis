# Monorepo root: workspace manifest + pytest config.
# src layout lives under packages/*/src; install packages individually, e.g.
# pip install -e packages/scraper && pip install -e packages/analysis

[project]
name = "legislative-analysis"
version = "0.1.0"
description = "Legislative analysis monorepo"
requires-python = ">=3.10"
dependencies = ["requests"]

[tool.pytest.ini_options]
testpaths = ["packages/scraper/tests", "packages/analysis/tests", "packages/pdfs/tests", "packages/extract/tests"]
